name: CI_build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution: CompressedFileViewer.sln

    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release]
        build_platform: [x64, x86]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Setup dotnet for ${{ matrix.build_platform }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          architecture: ${{ matrix.build_platform }}

      - name: NuGet restore solution
        run: nuget restore $env:Solution

      - name: Dotnet restore dependencies
        run: dotnet restore $env:Solution --arch ${{ matrix.build_platform }}

      - name: MSBuild of plugin dll
        run: >
          msbuild $env:Solution /m
          /p:configuration="${{ matrix.build_configuration }}"
          /p:platform="${{ matrix.build_platform }}"

      - name: Archive Release artifact
        if: matrix.build_configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: CompressedFileViewer_${{ matrix.build_platform }}
          path: CompressedFileViewer\publish\CompressedFileViewer${{ matrix.build_platform }}.zip

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: CompressedFileViewer_*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.zip
          generate_release_notes: true
